[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dasolve"
version = "0.0.1"
description = "A powerful command-line interface designed to streamline your data science workflows by automating project setup, data analysis, and solution planning with the help of AI."
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE"]
authors = [
    {name = "Aarush Dixit", email = "aarushdixit73@gmail.com"}
]
include = ["agents.py", "dasolve.py"]
keywords = ["data-science", "cli", "automation", "ai", 'thesolve', 'dsolve', 'the-solve', 'the-dsolve', 'dasolve', 'the-dasolve']
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer",
    "rich",
    "uv",
    "gitpython",
    "pandas",
    "numpy",
    "matplotlib",
    "pydantic-ai>=0.4.0",
    "pydantic-ai-slim>=0.4.0",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.5.2",
    "pydantic-core>=2.24.0",
    "pydantic-ai-slim>=0.4.0"
]

[project.urls]
Homepage = "https://github.com/aarushdixit889/dasolve"
Documentation = "https://github.com/aarushdixit889/dasolve/blob/main/README.md"
Repository = "https://github.com/aarushdixit889/dasolve"
